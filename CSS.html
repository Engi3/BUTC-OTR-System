<style>
    body {
        font-family: 'Sarabun', sans-serif;
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .spinner-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .card {
        border-radius: 15px;
        border: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-primary {
        border-radius: 10px;
        padding: 10px 20px;
    }

    /* Period Selector Styles */
    .period-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .period-item {
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
    }

    .period-item.selected {
        background-color: #0d6efd;
        color: white;
        border-color: #0d6efd;
    }

    .period-item.disabled {
        background-color: #e9ecef;
        cursor: not-allowed;
        opacity: 0.6;
    }

    .period-item:hover:not(.disabled):not(.selected) {
        background-color: #f1f3f5;
    }

    .d-none {
        display: none !important;
    }

    #app {
        min-height: 200px;
        width: 100%;
    }

    .image-preview {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 10px;
    }
</style>
